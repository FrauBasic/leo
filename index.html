<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Server</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
      background: radial-gradient(ellipse at top, #30442e, #202820 65%);
      color: #55dd55;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .creeper {
      position: relative;
      width: 180px;
      height: 240px;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font: inherit;
      filter: drop-shadow(0 14px 12px #0008);
      transform-origin: 50% 100%;
      -webkit-tap-highlight-color: transparent;
    }

    .creeper:focus-visible {
      border-radius: 0.2em;
      outline: 3px solid #c4ff9b;
      outline-offset: 0.3em;
    }

    .creeper-head,
    .creeper-body,
    .creeper-arm,
    .creeper-leg {
      position: absolute;
      background-color: #55b84a;
      background-image: repeating-conic-gradient(#ffffff12 0% 25%, transparent 0% 50%);
      background-size: 18px 18px;
      border: 6px solid #286331;
      box-shadow: inset 0 0 0 5px #77d75b;
    }

    .creeper-head {
      top: 0;
      left: 30px;
      width: 120px;
      height: 112px;
      z-index: 1;
    }

    .creeper-eye {
      position: absolute;
      top: 23px;
      width: 25px;
      height: 25px;
      background: #142017;
    }

    .creeper-eye.left {
      left: 15px;
    }

    .creeper-eye.right {
      right: 15px;
    }

    .creeper-mouth {
      position: absolute;
      left: 17px;
      bottom: 13px;
      width: 74px;
      height: 36px;
      background:
        linear-gradient(#142017, #142017) 0 0 / 25px 15px,
        linear-gradient(#142017, #142017) 25px 15px / 25px 21px,
        linear-gradient(#142017, #142017) 50px 0 / 24px 15px;
      background-repeat: no-repeat;
    }

    .creeper-body {
      top: 106px;
      left: 48px;
      width: 84px;
      height: 92px;
    }

    .creeper-arm {
      top: 114px;
      width: 30px;
      height: 78px;
    }

    .creeper-arm.left {
      left: 15px;
    }

    .creeper-arm.right {
      right: 15px;
    }

    .creeper-leg {
      top: 188px;
      width: 36px;
      height: 52px;
    }

    .creeper-leg.left {
      left: 48px;
    }

    .creeper-leg.right {
      right: 48px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 4rem);
      text-shadow: 3px 3px #111;
    }

    .title-button {
      position: relative;
      padding: 0;
      border: 0;
      background: none;
      color: inherit;
      font: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .title-button:focus-visible {
      border-radius: 0.2em;
      outline: 3px solid #c4ff9b;
      outline-offset: 0.18em;
    }

    .title-letter {
      display: inline-block;
      white-space: pre;
    }

    .title-button::after {
      position: absolute;
      inset: -0.2em;
      content: "";
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(circle, #d9ff91 0, #a6f34c88 22%, transparent 68%);
    }

    p {
      margin: 0;
      color: #ddd;
      font-size: 1.2rem;
    }

    main.exploding .creeper {
      animation: creeper-shake 300ms ease-in-out 2;
    }

    main.exploding .creeper-head,
    main.exploding .creeper-body,
    main.exploding .creeper-arm,
    main.exploding .creeper-leg {
      animation: creeper-part-blast 850ms cubic-bezier(0.18, 0.7, 0.25, 1) both;
    }

    main.exploding .creeper-head {
      --blast-x: -45px;
      --blast-y: -140px;
      --blast-rotate: -125deg;
    }

    main.exploding .creeper-body {
      --blast-x: 25px;
      --blast-y: 125px;
      --blast-rotate: 90deg;
    }

    main.exploding .creeper-arm.left {
      --blast-x: -145px;
      --blast-y: 20px;
      --blast-rotate: -220deg;
    }

    main.exploding .creeper-arm.right {
      --blast-x: 145px;
      --blast-y: 10px;
      --blast-rotate: 220deg;
    }

    main.exploding .creeper-leg.left {
      --blast-x: -90px;
      --blast-y: 120px;
      --blast-rotate: -160deg;
    }

    main.exploding .creeper-leg.right {
      --blast-x: 90px;
      --blast-y: 120px;
      --blast-rotate: 160deg;
    }

    main.exploding .title-button::after {
      animation: blast-flash 500ms ease-out;
    }

    main.exploding .title-letter {
      animation: text-blast 750ms cubic-bezier(0.18, 0.7, 0.25, 1) both;
      animation-delay: var(--delay);
    }

    @keyframes text-blast {
      0% {
        opacity: 1;
        transform: translate(0, 0) rotate(0) scale(1);
      }
      12% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(var(--blast-x), var(--blast-y)) rotate(var(--blast-rotate)) scale(0.2);
      }
    }

    @keyframes creeper-shake {
      0%, 100% {
        transform: translateX(0);
      }
      25%, 75% {
        transform: translateX(-7px);
      }
      50% {
        transform: translateX(7px);
      }
    }

    @keyframes creeper-part-blast {
      0% {
        opacity: 1;
        filter: brightness(2.2);
        transform: translate(0, 0) rotate(0) scale(1);
      }
      18% {
        opacity: 1;
        filter: brightness(2.2);
      }
      100% {
        opacity: 0;
        filter: brightness(2.2);
        transform: translate(var(--blast-x), var(--blast-y)) rotate(var(--blast-rotate)) scale(0.25);
      }
    }

    @keyframes blast-flash {
      0% {
        opacity: 0.9;
        transform: scale(0.2);
      }
      100% {
        opacity: 0;
        transform: scale(2.5);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      main.exploding .creeper,
      main.exploding .title-button::after {
        animation-duration: 1ms;
      }

      main.exploding .creeper-head,
      main.exploding .creeper-body,
      main.exploding .creeper-arm,
      main.exploding .creeper-leg {
        animation-duration: 1ms;
      }

      main.exploding .title-letter {
        animation-duration: 1ms;
        animation-delay: 0ms;
      }
    }
  </style>
</head>
<body>
  <main id="scene">
    <button class="creeper" id="creeper-button" type="button"
      aria-label="Creeper explodieren lassen">
      <div class="creeper-head">
        <span class="creeper-eye left"></span>
        <span class="creeper-eye right"></span>
        <span class="creeper-mouth"></span>
      </div>
      <div class="creeper-arm left"></div>
      <div class="creeper-arm right"></div>
      <div class="creeper-body"></div>
      <div class="creeper-leg left"></div>
      <div class="creeper-leg right"></div>
    </button>

    <div>
      <h1>
        <button class="title-button" id="boom-button" type="button"
          aria-label="Wir bauen einen Minecraft-Server. Klicken, um den Creeper explodieren zu lassen.">
          <span id="title-text" aria-hidden="true">⛏️ Wir bauen einen Minecraft-Server</span>
        </button>
      </h1>
      <p>Unsere Welt entsteht gerade ... 🌍</p>
    </div>
  </main>

  <script>
    const scene = document.querySelector("#scene");
    const button = document.querySelector("#boom-button");
    const creeperButton = document.querySelector("#creeper-button");
    const title = document.querySelector("#title-text");

    const letters = Array.from(title.textContent, (character, index) => {
      const angle = index * 2.4;
      const distance = 45 + (index * 37 % 110);
      const x = Math.cos(angle) * distance;
      const y = Math.sin(angle) * distance - 65;
      const rotation = (index % 2 === 0 ? 1 : -1) * (120 + index * 19 % 240);
      const delay = index * 9 % 100;
      const letter = document.createElement("span");

      letter.className = "title-letter";
      letter.textContent = character;
      letter.style.setProperty("--blast-x", `${x}px`);
      letter.style.setProperty("--blast-y", `${y}px`);
      letter.style.setProperty("--blast-rotate", `${rotation}deg`);
      letter.style.setProperty("--delay", `${delay}ms`);
      return letter;
    });

    title.replaceChildren(...letters);

    const explode = () => {
      if (scene.classList.contains("exploding")) {
        return;
      }

      button.disabled = true;
      creeperButton.disabled = true;
      scene.classList.add("exploding");
      window.setTimeout(() => {
        title.textContent = "Das wird das ulimative Minecraft-Erlebnis";
        button.setAttribute("aria-label", title.textContent);
        creeperButton.remove();
        scene.classList.remove("exploding");
      }, 950);
    };

    button.addEventListener("click", explode);
    creeperButton.addEventListener("click", explode);
  </script>
</body>
</html>
