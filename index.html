<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Server</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
      background: radial-gradient(ellipse at top, #30442e, #202820 65%);
      color: #55dd55;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .cube-button {
      position: relative;
      width: 180px;
      height: 180px;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font: inherit;
      filter: drop-shadow(0 14px 12px #0008);
      transform-origin: 50% 100%;
      -webkit-tap-highlight-color: transparent;
      perspective: 700px;
    }

    .cube-button:focus-visible {
      border-radius: 0.2em;
      outline: 3px solid #c4ff9b;
      outline-offset: 0.3em;
    }

    .green-cube {
      position: absolute;
      top: 50%;
      left: 20%;
      width: 128px;
      height: 128px;
      transform: translate(-50%, -50%) rotateX(-24deg) rotateY(35deg);
      transform-style: preserve-3d;
    }

    .cube-face {
      position: absolute;
      width: 128px;
      height: 128px;
      border: 3px solid #286331;
      box-shadow: inset 0 0 0 5px #77d75b;
      backface-visibility: hidden;
    }

    .cube-face.front {
      background: #55b84a;
      transform: translateZ(64px);
    }

    .cube-face.right {
      background: #3c8d3b;
      transform: rotateY(90deg) translateZ(64px);
    }

    .cube-face.back {
      background: #347b35;
      transform: rotateY(180deg) translateZ(64px);
    }

    .cube-face.left {
      background: #449c3f;
      transform: rotateY(-90deg) translateZ(64px);
    }

    .cube-face.top {
      background: #77d75b;
      transform: rotateX(90deg) translateZ(64px);
    }

    .cube-face.bottom {
      background: #286331;
      transform: rotateX(-90deg) translateZ(64px);
    }

    .cube-face.front {
      --blast-x: -60px;
      --blast-y: -130px;
      --blast-rotate: -140deg;
    }

    .cube-face.right {
      --blast-x: 135px;
      --blast-y: -65px;
      --blast-rotate: 180deg;
    }

    .cube-face.back {
      --blast-x: 55px;
      --blast-y: 150px;
      --blast-rotate: 120deg;
    }

    .cube-face.left {
      --blast-x: -145px;
      --blast-y: 40px;
      --blast-rotate: -190deg;
    }

    .cube-face.top {
      --blast-x: 20px;
      --blast-y: -170px;
      --blast-rotate: 200deg;
    }

    .cube-face.bottom {
      --blast-x: -20px;
      --blast-y: 165px;
      --blast-rotate: -160deg;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3rem);
      text-shadow: 3px 3px #111;
    }

    .title-button {
      position: relative;
      padding: 0;
      border: 0;
      background: none;
      color: inherit;
      font: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .title-button:focus-visible {
      border-radius: 0.2em;
      outline: 3px solid #c4ff9b;
      outline-offset: 0.18em;
    }

    .title-letter {
      display: inline-block;
      white-space: pre;
    }

    .title-button::after {
      position: absolute;
      inset: -0.2em;
      content: "";
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(circle, #d9ff91 0, #a6f34c88 22%, transparent 68%);
    }

    p {
      margin: 0;
      color: #ddd;
      font-size: 1.2rem;
    }

    main.exploding .cube-button {
      animation: cube-shake 300ms ease-in-out 2;
    }

    main.exploding .cube-face {
      animation: cube-face-blast 850ms cubic-bezier(0.18, 0.7, 0.25, 1) both;
    }

    main.exploding .title-button::after {
      animation: blast-flash 500ms ease-out;
    }

    main.exploding .title-letter {
      animation: text-blast 750ms cubic-bezier(0.18, 0.7, 0.25, 1) both;
      animation-delay: var(--delay);
    }

    @keyframes text-blast {
      0% {
        opacity: 1;
        transform: translate(0, 0) rotate(0) scale(1);
      }
      12% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(var(--blast-x), var(--blast-y)) rotate(var(--blast-rotate)) scale(0.2);
      }
    }

    @keyframes cube-shake {
      0%, 100% {
        transform: translateX(0);
      }
      25%, 75% {
        transform: translateX(-7px);
      }
      50% {
        transform: translateX(7px);
      }
    }

    @keyframes cube-face-blast {
      0% {
        opacity: 1;
        filter: brightness(2.2);
        translate: 0 0;
        rotate: 0deg;
        scale: 1;
      }
      18% {
        opacity: 1;
        filter: brightness(2.2);
      }
      100% {
        opacity: 0;
        filter: brightness(2.2);
        translate: var(--blast-x) var(--blast-y);
        rotate: var(--blast-rotate);
        scale: 0.25;
      }
    }

    @keyframes blast-flash {
      0% {
        opacity: 0.9;
        transform: scale(0.2);
      }
      100% {
        opacity: 0;
        transform: scale(2.5);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      main.exploding .cube-button,
      main.exploding .title-button::after {
        animation-duration: 1ms;
      }

      main.exploding .cube-face {
        animation-duration: 1ms;
      }

      main.exploding .title-letter {
        animation-duration: 1ms;
        animation-delay: 0ms;
      }
    }
  </style>
</head>
<body>
  <main id="scene">
    <button class="cube-button" id="cube-button" type="button"
      aria-label="Grünen Würfel explodieren lassen">
      <div class="green-cube" aria-hidden="true">
        <span class="cube-face front"></span>
        <span class="cube-face right"></span>
        <span class="cube-face back"></span>
        <span class="cube-face left"></span>
        <span class="cube-face top"></span>
        <span class="cube-face bottom"></span>
      </div>
    </button>

    <div>
      <h1>
        <button class="title-button" id="boom-button" type="button"
          aria-label="Wir bauen einen Minecraft-Server. Klicken, um den Würfel explodieren zu lassen.">
          <span id="title-text" aria-hidden="true">Wir bauen einen<br>Minecraft-Server</span>
        </button>
      </h1>
      <p>Unsere Welt entsteht gerade ... </p>
    </div>
  </main>

  <script>
    const scene = document.querySelector("#scene");
    const button = document.querySelector("#boom-button");
    const cubeButton = document.querySelector("#cube-button");
    const title = document.querySelector("#title-text");

    let characterIndex = 0;
    const letters = Array.from(title.childNodes).flatMap((node) => {
      if (node.nodeName === "BR") {
        return [document.createElement("br")];
      }

      return Array.from(node.textContent, (character) => {
        const index = characterIndex++;
        const angle = index * 2.4;
        const distance = 45 + (index * 37 % 110);
        const x = Math.cos(angle) * distance;
        const y = Math.sin(angle) * distance - 65;
        const rotation = (index % 2 === 0 ? 1 : -1) * (120 + index * 19 % 240);
        const delay = index * 9 % 100;
        const letter = document.createElement("span");

        letter.className = "title-letter";
        letter.textContent = character;
        letter.style.setProperty("--blast-x", `${x}px`);
        letter.style.setProperty("--blast-y", `${y}px`);
        letter.style.setProperty("--blast-rotate", `${rotation}deg`);
        letter.style.setProperty("--delay", `${delay}ms`);
        return letter;
      });
    });

    title.replaceChildren(...letters);

    const explode = () => {
      if (scene.classList.contains("exploding")) {
        return;
      }

      button.disabled = true;
      cubeButton.disabled = true;
      scene.classList.add("exploding");
      window.setTimeout(() => {
        title.textContent = "Das wird das ulimative Minecraft-Erlebnis";
        button.setAttribute("aria-label", title.textContent);
        cubeButton.remove();
        scene.classList.remove("exploding");
      }, 950);
    };

    button.addEventListener("click", explode);
    cubeButton.addEventListener("click", explode);
  </script>
</body>
</html>
